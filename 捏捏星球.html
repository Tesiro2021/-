<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>捏捏星球 · 今天先松弛一下</title>
<style>
:root{--ink:#38473f;--green:#426f58;--paper:#faf8f0;--line:#dedfd2}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 system-ui,-apple-system,sans-serif}button{font:inherit;cursor:pointer;color:inherit}button:focus-visible{outline:3px solid #976bc4;outline-offset:4px}button:disabled{cursor:default;opacity:.55}header,main,footer{max-width:1160px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:21px;font-weight:800}.brand small{font-size:11px;display:block;letter-spacing:3px;font-weight:500}.pill{border:1px solid var(--line);border-radius:40px;background:white;padding:9px 17px}.top-right{display:flex;gap:8px;align-items:center}.intro{display:flex;justify-content:space-between;align-items:end;margin:16px 0 28px}.eyebrow{font-size:12px;letter-spacing:3px;color:#708873}h1{font-size:clamp(30px,4vw,48px);letter-spacing:-2px;line-height:1.3;margin:10px 0}p{color:#788078;margin:8px 0}.date{font-size:13px}.layout{display:grid;grid-template-columns:1.2fr 1fr;gap:24px}.card{background:#fff;border:1px solid var(--line);border-radius:26px;overflow:hidden}.room{height:370px;background:#e8eadc;position:relative;isolation:isolate;overflow:hidden}.room:before{content:"";position:absolute;inset:68% 0 0;background:#d9c5a8;transform:skewY(-4deg);transform-origin:left}.window{position:absolute;left:11%;top:12%;width:37%;height:44%;border:10px solid #f9f5e8;border-radius:65px 65px 5px 5px;background:linear-gradient(#c7e2dc,#f0ecce);box-shadow:5px 6px 0 #cad0bb}.window:before{content:"";position:absolute;left:48%;height:100%;width:5px;background:#f9f5e8}.sun{position:absolute;right:14%;top:16%;height:34px;width:34px;border-radius:50%;background:#ffdc83;box-shadow:0 0 35px #ffdc83}.shelf{position:absolute;right:10%;top:28%;width:27%;height:9px;background:#b29374;border-radius:5px}.shelf:before{content:"📚";position:absolute;bottom:0;font-size:38px}.rug{position:absolute;bottom:7%;left:14%;width:72%;height:23%;border-radius:50%;background:#a8b9a0;border:9px solid #bac8af;transform:rotate(-6deg)}.sofa{position:absolute;bottom:22%;left:23%;width:55%;height:26%;background:#d5a18c;border-radius:30px 30px 15px 15px;box-shadow:0 13px 0 #a77362}.sofa:after{content:"";position:absolute;inset:40% -5% 0;border-radius:20px;background:#e2b49b;box-shadow:inset 0 -5px #c99881}.cat{position:absolute;left:39%;bottom:29%;font-size:65px;z-index:2;filter:drop-shadow(0 4px 0 #0001);animation:breathe 4s ease-in-out infinite}.plant{position:absolute;right:5%;bottom:19%;font-size:64px}.lamp{position:absolute;left:6%;bottom:21%;font-size:65px}.painting{position:absolute;right:17%;top:9%;font-size:39px}.hidden{display:none!important}.room-tag{position:absolute;bottom:15px;left:20px;font-size:11px;background:#fffc;padding:4px 12px;border-radius:20px}.room-caption{padding:20px 24px;display:flex;justify-content:space-between;align-items:center}.room-caption strong{font-size:17px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#7a9c71;margin-right:6px}.shop{padding:20px 24px;border-top:1px solid var(--line)}.shop-title{display:flex;justify-content:space-between;font-size:13px;margin-bottom:14px}.items{display:flex;gap:9px}.item{flex:1;background:#f8f7f0;border:1px solid #e5e5da;border-radius:15px;padding:12px 3px;font-size:12px}.item span{font-size:25px;display:block}.play{padding:22px;min-height:548px}.tabs{display:flex;gap:6px;background:#f3f3ea;padding:5px;border-radius:14px}.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:10px 3px;font-size:13px}.tab.active{background:white;box-shadow:0 2px 5px #0001;color:var(--green);font-weight:700}h2{font-size:23px;margin:23px 0 4px}.hint{font-size:13px;min-height:42px}.board{min-height:275px;margin:18px 0;display:flex;align-items:center;justify-content:center;background:#f5f3ef;border-radius:22px;padding:20px}.bubbles{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;width:100%;max-width:300px}.bubble{aspect-ratio:1;border:0;border-radius:50%;background:radial-gradient(circle at 33% 25%,#fff9,#fff0 45%),#cbbce6;box-shadow:inset 0 -6px 8px #8d75b12b,0 5px 0 #b2a1cb;transition:transform .15s}.bubble:nth-child(3n){background-color:#b2d5c6;box-shadow:inset 0 -6px 8px #678d712b,0 5px 0 #92b9a7}.bubble:nth-child(3n + 1){background-color:#eac5a0;box-shadow:inset 0 -6px 8px #b8875b2b,0 5px 0 #d2b08a}.bubble.popped{transform:scale(.88);box-shadow:inset 0 3px 7px #0002;background:#e5e2db;opacity:.65}.actions{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px}.primary{background:var(--green);border:0;color:white;padding:11px 20px;border-radius:12px}.soft{border:1px solid var(--line);background:white;padding:9px 13px;border-radius:12px}.desk{width:100%}.objects{display:flex;gap:12px;justify-content:center;min-height:85px;align-items:center}.object{font-size:36px;background:white;border:2px solid transparent;border-radius:15px;padding:7px}.object.selected{border-color:#648c73;transform:translateY(-6px)}.bins{display:flex;gap:8px;margin-top:28px}.bin{flex:1;border:2px dashed #c4cbb9;background:#e8eddf;border-radius:15px;padding:16px 2px;font-size:12px;min-height:86px}.bin b{display:block;font-size:26px}.moods{display:flex;flex-wrap:wrap;gap:9px;justify-content:center}.mood{background:white;border:1px solid #d9d7e3;padding:9px 14px;border-radius:25px}.mood.selected{background:#dfd4ee;border-color:#b19dc9}.trash{text-align:center;width:100%}.trash-target{font-size:70px;border:0;background:none;display:block;margin:14px auto 0;transition:transform .2s}.trash-target:hover{transform:rotate(-8deg)}.note{margin-top:22px;border:1px solid var(--line);border-radius:18px;padding:16px 22px;font-size:13px;color:#6c786c;display:flex;gap:14px}.note span{font-size:24px}footer{font-size:12px;color:#92998b;display:flex;justify-content:space-between;gap:12px}#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#38473f;color:white;padding:13px 23px;border-radius:16px;z-index:10;max-width:90%;width:max-content;box-shadow:0 8px 30px #0002;pointer-events:none}.spark{position:fixed;pointer-events:none;font-size:24px;z-index:20;animation:fly .7s ease-out forwards}@keyframes fly{to{transform:translateY(-90px) rotate(20deg);opacity:0}}@keyframes breathe{50%{transform:translateY(-3px)}}@media(max-width:760px){header,main,footer{padding:16px}.layout{grid-template-columns:1fr}.intro{margin-top:0}.date{display:none}.room{height:310px}.play{min-height:0}.brand{font-size:17px}.pill{padding:8px 11px}.top-right{font-size:12px}footer{flex-wrap:wrap}.board{min-height:275px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="brand">✳ 捏捏星球<small>LITTLE MOMENTS OF CALM</small></div><div class="top-right"><button id="sound" class="pill" aria-pressed="false">♫ 声音关</button><div class="pill">☀ <b id="balance">0</b> 松弛值</div></div></header>
<main>
<div class="intro"><div><div class="eyebrow">YOUR LITTLE SOFT SPACE</div><h1>今天，先松弛一下。</h1><p>不用很厉害，也可以拥有很舒服的一天。</p></div><div class="date">没有倒计时 · 没有输赢 · 随时休息</div></div>
<div class="layout">
<section class="card" aria-label="我的小房间">
<div class="room"><div class="window"><div class="sun"></div></div><div class="shelf"></div><div class="rug"></div><div class="sofa"></div><div class="cat">🐈</div><div class="plant hidden" id="decor-plant">🪴</div><div class="lamp hidden" id="decor-lamp">🛋️</div><div class="painting hidden" id="decor-art">🖼️</div><div class="room-tag">慢慢来，这里一直为你留着灯</div></div>
<div class="room-caption"><div><strong>我的松弛小窝</strong><p style="font-size:12px">让每一点小快乐，都有地方安放。</p></div><span style="font-size:12px"><i class="dot"></i>休息中</span></div>
<div class="shop"><div class="shop-title"><b>给小窝添一点喜欢</b><span>玩一会儿就能带回家</span></div><div class="items"><button class="item" data-buy="plant"><span>🪴</span>阳台绿植 · 20 ☀</button><button class="item" data-buy="lamp"><span>🛋️</span>柔软单椅 · 35 ☀</button><button class="item" data-buy="art"><span>🖼️</span>一幅小画 · 50 ☀</button></div></div>
</section>
<section class="card play" aria-label="解压游乐场">
<nav class="tabs" aria-label="选择玩法"><button class="tab active" data-game="bubble" aria-pressed="true">◌ 戳戳气泡</button><button class="tab" data-game="desk" aria-pressed="false">▧ 整理桌面</button><button class="tab" data-game="mood" aria-pressed="false">♡ 情绪垃圾桶</button></nav>
<h2 id="title"></h2><p class="hint" id="hint"></p><div class="board" id="board"></div>
<div class="actions"><span id="progress" aria-live="polite"></span><button class="soft" id="reset">再来一盘 ↻</button></div>
</section>
</div>
<div class="note"><span>✧</span><div id="quote">不必把每一分钟都填满。发一会儿呆，也很好。</div></div>
</main>
<footer><span id="save-note">进度只保存在当前浏览器 · 不用登录</span><span>为平凡日子里的你，留一个柔软角落。</span></footer>
<div id="toast" role="status" class="hidden"></div>
<script>
'use strict';
const KEY='soft-planet-v1', prices={plant:20,lamp:35,art:50};
let state={points:0,owned:[]}, storageOK=true;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'null');if(raw&&Number.isSafeInteger(raw.points)&&raw.points>=0&&Array.isArray(raw.owned))state={points:raw.points,owned:[...new Set(raw.owned.filter(x=>Object.hasOwn(prices,x)))]};}catch(e){storageOK=false}
const $=id=>document.getElementById(id);
let game='bubble', popped=new Set(), sorted=new Set(), selected=null, mood=null, released=false, toastTimer;
let audio=null, audioOn=false, ambient=null;
function notify(text){$('toast').textContent=text;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),2600)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){storageOK=false}if(!storageOK)$('save-note').textContent='当前浏览器无法保存进度，本次仍可正常游玩'}
function update(){ $('balance').textContent=state.points;for(const key of Object.keys(prices)){const owned=state.owned.includes(key);$('decor-'+key).classList.toggle('hidden',!owned);const btn=document.querySelector('[data-buy="'+key+'"]');btn.disabled=owned; if(owned)btn.innerHTML='<span>'+({plant:'🪴',lamp:'🛋️',art:'🖼️'}[key])+'</span>已经在小窝里啦 ✓';}}
function reward(n){state.points+=n;save();update()}
function tone(freq=600){if(!audioOn||!audio)return;const osc=audio.createOscillator(),gain=audio.createGain();osc.type='sine';osc.frequency.setValueAtTime(freq,audio.currentTime);osc.frequency.exponentialRampToValueAtTime(freq*.55,audio.currentTime+.13);gain.gain.setValueAtTime(.11,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.19);osc.connect(gain).connect(audio.destination);osc.start();osc.stop(audio.currentTime+.2)}
function spark(el){const r=el.getBoundingClientRect(),s=document.createElement('span');s.className='spark';s.textContent='✦';s.style.left=(r.x+r.width/2)+'px';s.style.top=r.y+'px';s.style.color='#ba9466';document.body.append(s);setTimeout(()=>s.remove(),750)}
const objects=[{id:'book',emoji:'📕',label:'书本',bin:'书架'},{id:'pencil',emoji:'✏️',label:'铅笔',bin:'笔筒'},{id:'cup',emoji:'☕',label:'杯子',bin:'杯垫'}];
function progress(){ $('progress').textContent=game==='bubble'?`已戳 ${popped.size} / 12 · 每颗 +1 ☀`:game==='desk'?`已归位 ${sorted.size} / 3 · 完成 +10 ☀`:released?'放下了一点点，已经很棒了。':'放下一件小烦恼 · +5 ☀'; }
function render(){
const titles={bubble:['噗！烦恼少了一点。','戳一颗，放松一下。全部戳完还有 5 点小奖励。'],desk:['桌面整齐，脑袋放空。','先点物品，再点对应位置。也可以把物品拖过去。'],mood:['不开心，暂时丢掉吧。','选一个今天的心情，再点垃圾桶。这里不催你振作。']};
$('title').textContent=titles[game][0];$('hint').textContent=titles[game][1];$('board').replaceChildren();
if(game==='bubble'){const grid=document.createElement('div');grid.className='bubbles';for(let i=0;i<12;i++){const b=document.createElement('button');b.className='bubble'+(popped.has(i)?' popped':'');b.setAttribute('aria-label','气泡 '+(i+1));b.disabled=popped.has(i);b.onclick=()=>{if(popped.has(i))return;popped.add(i);b.disabled=true;b.classList.add('popped');reward(1);tone(450+i*35);spark(b);if(popped.size===12){reward(5);notify('一盘小快乐完成，额外 +5 ☀');$('quote').textContent='你不需要一直紧绷。松一点，也没关系。'}progress()};grid.append(b)}$('board').append(grid)}
if(game==='desk'){const desk=document.createElement('div');desk.className='desk';const row=document.createElement('div');row.className='objects';for(const o of objects){if(sorted.has(o.id))continue;const b=document.createElement('button');b.className='object'+(selected===o.id?' selected':'');b.textContent=o.emoji;b.setAttribute('aria-label',o.label);b.setAttribute('aria-pressed',String(selected===o.id));b.draggable=true;b.ondragstart=e=>{selected=o.id;e.dataTransfer.setData('text/plain',o.id)};b.onclick=()=>{selected=o.id;render()};row.append(b)}if(sorted.size===3)row.textContent='✨ 一切都回到了舒服的位置。';desk.append(row);const bins=document.createElement('div');bins.className='bins';for(const o of objects){const b=document.createElement('button');b.className='bin';b.innerHTML='<b>'+(sorted.has(o.id)?o.emoji:'⌑')+'</b>'+o.bin;b.setAttribute('aria-label',o.bin);b.onclick=()=>place(o.id);b.ondragover=e=>e.preventDefault();b.ondrop=e=>{e.preventDefault();const id=e.dataTransfer.getData('text/plain');if(objects.some(x=>x.id===id)&&!sorted.has(id))selected=id;place(o.id)};bins.append(b)}desk.append(bins);$('board').append(desk)}
if(game==='mood'){const box=document.createElement('div');box.className='trash';const moods=document.createElement('div');moods.className='moods';for(const text of ['😮‍💨 好累','🫠 不想上班','🌪️ 脑子很乱','☁️ 有点烦']){const b=document.createElement('button');b.className='mood'+(mood===text?' selected':'');b.textContent=text;b.disabled=released;b.setAttribute('aria-pressed',String(mood===text));b.onclick=()=>{mood=text;render()};moods.append(b)}box.append(moods);const bin=document.createElement('button');bin.className='trash-target';bin.textContent=released?'🌸':'🗑️';bin.setAttribute('aria-label','放下烦恼');bin.disabled=released;bin.onclick=()=>{if(!mood){notify('先选一个心情，让它在这里歇一会儿。');return}released=true;reward(5);tone(800);spark(bin);$('quote').textContent='今天也辛苦了。可以先休息，再慢慢处理。';notify('把烦恼变成小花，松弛值 +5 ☀');render()};box.append(bin);const caption=document.createElement('p');caption.style.fontSize='12px';caption.textContent=released?'留下一朵花，给现在的自己。':'选好心情后，点一下垃圾桶';box.append(caption);$('board').append(box)}
progress();}
function place(id){if(!selected){notify('先选一样桌面上的小物品。');return}if(selected!==id){tone(220);notify('它有自己的位置，再试试另一个。');return}if(sorted.has(id))return;sorted.add(id);selected=null;tone(700);if(sorted.size===3){reward(10);notify('收拾好了，小窝和心情都轻一点。+10 ☀')}render()}
document.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{game=b.dataset.game;document.querySelectorAll('[data-game]').forEach(t=>{t.classList.toggle('active',t===b);t.setAttribute('aria-pressed',String(t===b))});render()});
$('reset').onclick=()=>{if(game==='bubble')popped.clear();if(game==='desk'){sorted.clear();selected=null}if(game==='mood'){mood=null;released=false}render()};
document.querySelectorAll('[data-buy]').forEach(b=>b.onclick=()=>{const id=b.dataset.buy;if(state.owned.includes(id))return;if(state.points<prices[id]){notify('还差 '+(prices[id]-state.points)+' 点松弛值，慢慢攒就好。');return}state.points-=prices[id];state.owned.push(id);save();update();tone(1000);notify('喜欢的小东西，已经放进房间啦。')});
$('sound').onclick=async()=>{try{if(!audio){const C=window.AudioContext||window.webkitAudioContext;if(!C)throw new Error('audio unavailable');audio=new C();ambient=audio.createGain();ambient.gain.value=0;ambient.connect(audio.destination);[174.61,220,261.63].forEach(freq=>{const osc=audio.createOscillator();osc.frequency.value=freq;osc.connect(ambient);osc.start()})}await audio.resume();audioOn=!audioOn;ambient.gain.setTargetAtTime(audioOn?.009:0,audio.currentTime,.3);$('sound').textContent=audioOn?'♫ 声音开':'♫ 声音关';$('sound').setAttribute('aria-pressed',String(audioOn));tone()}catch(e){notify('这个浏览器暂不支持声音，仍然可以安静地玩。')}};
document.addEventListener('visibilitychange',()=>{if(audio){if(document.hidden)audio.suspend();else if(audioOn)audio.resume().catch(()=>{})}});
save();update();render();
</script>
</body>
</html>
